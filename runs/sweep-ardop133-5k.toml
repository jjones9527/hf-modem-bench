# (ARDOP_Win TNC.ini unchanged: DriveLevel 90 / 75) and rules as ARDOP 1.0.2.9's Stage 1, so the two compare directly.
# Sweep, 5 KB part: sweep-ardop-5k + knee-ardop-5k + sweep-ardop-5k-low in one (WGN -10 left out: out of spec for every modem).
