# Example test matrix (coarse pass). Copy, edit, then:
#   hfbench sheet runs/my-matrix.toml
#
# Channel settings follow the Teensy IONOS simulator (firmware 2.03).
# Values marked TBD are open questions in docs/test-protocol.md.

[campaign]
name = "coarse01"              # becomes the run-ID prefix and the campaign directory name
stage = "coarse"               # coarse | targeted | impairment | pilot
replicates = 3
# IONOS presets: WGN, MPG (0.1 Hz/0.5 ms), MPM (0.5/1), MPP (1/2), MPD (2/4)
profiles = ["WGN", "MPG", "MPM", "MPP", "MPD"]
snr_db = [30, 20, 10, 5, 0]    # IONOS S:N, 1 dB steps, referenced to ionos.bandwidth_hz
order = "blocked-random"       # blocked by modem, randomised within each block
order_seed = 20261110
abort_minutes = 30
abort_retries = 3

# Targeted passes: override the SNR list per profile to refine around each knee.
# [campaign.snr_by_profile]
# MPM = [12, 10, 8, 6]

[ionos]
bandwidth_hz = 3000            # 3000 for HF; S:N is measured in this bandwidth
multipaths = 2                 # 2 or 4 paths for the MP* presets

[payload]
# Attach this file to each message. Regenerate exactly with:
#   hfbench payload make payloads/payload-50k.bin --bytes 51200 --seed 1
file = "payload-50k.bin"
bytes = 51200
sha256 = "a324e9181248799f8023f76ea2277f1d76d731a4302b46ecd26d0c12d927ba0b"
messages = 10                  # per run, both directions: 5 queued at each station

[[modems]]
name = "VARA HF"
version = "TBD"
bandwidth_hz = 2300

[[modems]]
name = "ARDOP"
version = "TBD"
bandwidth_hz = 2000

[[modems]]
name = "Data2G"
version = "TBD"
# bandwidth_hz = TBD

# Impairments are crossed with everything above, so keep the coarse pass at
# "none". See runs/example-impairments.toml for the WGN-only impairment pass.
[[impairments]]
name = "none"
