# Stage 2 (test-plan.md): Mercury 1.9.23 WGN sweep on the same IONOS settings as ARDOP 1.0.2.9 (sweep-ardop-50k/-5k/-low),
# one-way station 2 (VE3XZQ) -> station 1 (VA3ZTF), 10 messages per run, recovery on, 60-min time box. Station 2s Winlink
# connects through the bench relay (8320 -> 8310) holding Winlink Expresss 5-min P2P timer DISCONNECT (results-log.md);
# start with hfbench_start_campaign.ps1 -Relay. Mercury sits at the tone reference (tx_gain +3.5 / +3.0), so its data
# S:N is close to the setting at high settings; the measured S:N (audio listen) is the axis. Approved 15 Nov 2026.

# TRIMMED 16 Nov 2026 ~18:00 UTC (operator decision): Mercury's receiver froze in 6 of 13 sessions of the
# 50 KB sweep, so replicates mostly re-measure the freeze. One run per setting is kept: 0001 (WGN 12), 0002
# (17), 0003 (-10), 0004 (2), 0007 (-5), 0012 (7), 0013 (-2). The bench's runsheet.csv holds those 7 rows;
# runsheet-full.csv is the sheet this matrix generates (21 runs). Freezes: Mercury restarted, run recorded dnc.

[campaign]
name = "sweep-mercury-5k"
stage = "coarse"
replicates = 3
profiles = ["WGN"]
snr_db = [17, 12, 7, 2, -2, -5, -10]
order = "blocked-random"
order_seed = 21
abort_minutes = 90
abort_retries = 3
time_box_minutes = 60

[ionos]
bandwidth_hz = 3000
multipaths = 2

[payload]
file = "Text_5KB"
bytes = 5120
sha256 = "85741279e9a689624407e58e599340c048a72fdd56c9695345c6a1ac827384d4"
messages = 10

[[modems]]
name = "Mercury"
version = "1.9.23"
bandwidth_hz = 2750

[[impairments]]
name = "none"
