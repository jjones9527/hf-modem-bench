# Stage 3 (test-plan.md): VARA HF 4.9.1, registered at both ends (station 2 runs as VA3ZTF, D2 resolved 18 Nov),
# same WGN settings as ARDOP 1.0.2.9, Mercury and Data2G, one-way station 2 -> station 1, recovery on, 60-min time box,
# station 2 through the bench relay (8320 -> 8310) holding Winlink Express's timer DISCONNECT (D6). Started by
# hfbench_start_vara.ps1; drive level set to the reference (D5, vara-level). Measured S:N is the axis.
[campaign]
name = "smoke-vara"
stage = "smoke"
replicates = 1
profiles = ["WGN"]
snr_db = [18]
order = "sequential"
abort_minutes = 90
abort_retries = 3
time_box_minutes = 60

[ionos]
bandwidth_hz = 3000
multipaths = 2

[payload]
file = "Text_50KB"
bytes = 51200
sha256 = "3ec10a0b30de0039bb0b949d7e160a5d4625c03ba2f245a60785d3973e0279f9"
messages = 10

[[modems]]
name = "VARA HF"
version = "4.9.1"
bandwidth_hz = 2750

[[impairments]]
name = "none"
