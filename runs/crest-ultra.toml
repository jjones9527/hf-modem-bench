# ULTRA (ProjectUltra) 0.6.2-pre-alpha, same WGN settings, order seeds and time box as VARA HF, ARDOP 1.0.2.9,
# Mercury and Data2G; one-way station 2 (VE3XZQ) -> station 1 (VA3ZTF): ULTRA rejects a call from its own callsign.
# Station 2 through the bench relay (8320 -> 8310). Started by hfbench_start_ultra.ps1 (recovery restarts both TNCs).
# Drive: ULTRA default --tx-drive 0.50 (peaks -6 dBFS, about VARA's; average ~7 dB under the reference, which
# ULTRA cannot reach, D5 exception as VARA). Measured S:N is the axis.
[campaign]
name = "crest-ultra"
stage = "crest"
replicates = 1
profiles = ["WGN"]
snr_db = [40, 22, 17, 12, 7, 2, -2, -5]
order = "sequential"
abort_minutes = 25
abort_retries = 1
time_box_minutes = 20

[ionos]
bandwidth_hz = 3000
multipaths = 2

[payload]
file = "Text_5KB"
bytes = 5120
sha256 = "85741279e9a689624407e58e599340c048a72fdd56c9695345c6a1ac827384d4"
messages = 3

[[modems]]
name = "ULTRA"
version = "0.6.2"
bandwidth_hz = 2750

[[impairments]]
name = "none"
