# Stage 4 (CCIR fading, 20 Nov 2026): VARA HF 4.9.1, registered at both ends (both stations VA3ZTF), ALC drive -3,
# one-way station 2 -> station 1 through the bench relay (8320 -> 8310). IONOS CCIR channels MPG (good: 0.1 Hz /
# 0.5 ms), MPM (moderate: 0.5 Hz / 1 ms), MPP (poor: 1 Hz / 2 ms), two paths, 3 kHz. The same IONOS settings for
# every modem: 50 KB at 30 and 20, 5 KB at 10; 3 runs each, blocked random, 60-min time box. Measured S:N is the axis.
[campaign]
name = "ccir-vara-50k"
stage = "fading"
replicates = 3
profiles = ["MPG", "MPM", "MPP"]
snr_db = [30, 20]
order = "blocked-random"
order_seed = 50
abort_minutes = 90
abort_retries = 3
time_box_minutes = 60

[ionos]
bandwidth_hz = 3000
multipaths = 2

[payload]
file = "Text_50KB"
bytes = 51200
sha256 = "3ec10a0b30de0039bb0b949d7e160a5d4625c03ba2f245a60785d3973e0279f9"
messages = 10

[[modems]]
name = "VARA HF"
version = "4.9.1"
bandwidth_hz = 2750

[[impairments]]
name = "none"
