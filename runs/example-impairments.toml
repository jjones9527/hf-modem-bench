# Example impairment pass. IONOS applies OFFSET, FADE and FM only on WGN
# (they are ignored on multipath presets), so this matrix is WGN-only.
# Choose snr_db a few dB above each modem's WGN knee from the coarse pass.

[campaign]
name = "imp01"
stage = "impairment"
replicates = 3
profiles = ["WGN"]
snr_db = [15]                  # TBD after the coarse pass
order_seed = 20261111

[ionos]
bandwidth_hz = 3000

[payload]
# Payload set: 10 random-text files of 51,200 bytes (Windows Desktop\Text_50KB),
# one file attached per message. B2F compresses each to about 82% (~42.2 KB on
# the air), consistently to within 0.1%. Check with: hfbench payload hash <folder>
# Fixed assignment (sorted names): station 1 sends File-2oE8o, File-A9TS9,
# File-FJYnL, File-NqdBp, File-YtirF; station 2 sends File-bOgW3, File-gkTVB,
# File-h71Al, File-ozUgP, File-z7j7V.
file = "Text_50KB"
bytes = 51200                  # per file, before compression
sha256 = "3ec10a0b30de0039bb0b949d7e160a5d4625c03ba2f245a60785d3973e0279f9"   # set hash
messages = 10                  # per run, both directions: 5 queued at each station

[[modems]]
name = "VARA HF"
version = "TBD"
bandwidth_hz = 2300

[[modems]]
name = "ARDOP"
version = "TBD"
bandwidth_hz = 2000

[[impairments]]
name = "none"                  # same-session control

[[impairments]]
name = "offset+50"
settings = { OFFSET = 50 }

[[impairments]]
name = "offset-50"
settings = { OFFSET = -50 }

[[impairments]]
name = "offset+20"
settings = { OFFSET = 20 }

# Slow drift, as from an unstable rig: +/-10 Hz at 0.1 Hz.
[[impairments]]
name = "drift10"
settings = { "FM DEVIATION" = 10, "FM RATE" = 0.1 }

# Flat fading. This is NOT a substitute for the CCIR "Flutter" profile, which
# IONOS lacks: flat fading has no frequency selectivity or Doppler spread.
[[impairments]]
name = "flatfade20@10Hz"
settings = { "FADE DEPTH" = 20, "FADE FREQ" = 10 }

# The SNR step is done mid-run by sending a new mode command (e.g. WGN:5)
# over serial or with the knob. Stamp the time with `hfbench mark "WGN:5"`.
[[impairments]]
name = "snr-step"
notes = "start at snr_db, step to snr_db-10 at 3 min"
