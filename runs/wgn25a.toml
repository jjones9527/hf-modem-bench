# WGN 25, with the USB adapters swapped between the ARDOP instances (scripts/windows/swap_ardop_devices.ps1):
# station 1 (VA3ZTF) now uses the Syba (C-Media), station 2 (VE3XZQ) the Sabrent. Cabling and IONOS as in swap02.
# Tone check: tx +2.6 / +2.9 dB vs reference, mismatch -0.3 dB, rx mismatch +0.7 dB.
# Questions: is ARDOP 16QAM clean at ~19 dB true S:N? Which direction(s) shift up?

[campaign]
name = "wgn25a"
stage = "pilot"
replicates = 2
profiles = ["WGN"]
snr_db = [25]
order = "sequential"
abort_minutes = 90          # 10 x ~42 KB at ARDOP ~14 dB data S:N took ~50 min on 10 Nov
abort_retries = 3

[ionos]
bandwidth_hz = 3000
multipaths = 2

[payload]
file = "Text_50KB"
bytes = 51200
sha256 = "3ec10a0b30de0039bb0b949d7e160a5d4625c03ba2f245a60785d3973e0279f9"
messages = 10

[[modems]]
name = "ARDOP"
version = "1.0.2.9"
bandwidth_hz = 2000

[[impairments]]
name = "none"
