# Pilot: ARDOP only, WGN 20, 3 replicates, 5 x 50 KB each way.
# Purpose: prove the automated pipeline end to end and see the run-to-run spread.

[campaign]
name = "pilot01"
stage = "pilot"
replicates = 3
profiles = ["WGN"]
snr_db = [20]
order = "sequential"
abort_minutes = 90          # 10 x ~42 KB at ARDOP ~14 dB data S:N took ~50 min on 10 Nov
abort_retries = 3

[ionos]
bandwidth_hz = 3000
multipaths = 2

[payload]
file = "Text_50KB"
bytes = 51200
sha256 = "3ec10a0b30de0039bb0b949d7e160a5d4625c03ba2f245a60785d3973e0279f9"
messages = 10

[[modems]]
name = "ARDOP"
version = "1.0.2.9"
bandwidth_hz = 2000

[[impairments]]
name = "none"
