# Stage 7 (fading, N5TW sweep plus MPM; decided 21 Nov 2026): VARA HF 4.9.1, registered at both ends (both
# stations VA3ZTF), ALC drive -3, one-way 2 -> 1 through the relay. IONOS channel MPM, 2 paths, 3 kHz.
# THE CHANNEL IS SET WITH THE IONOS KNOB (over USB firmware 2.03 sets only the display and S:N); the
# run sheet's MPM command keeps the display in step and sets the S:N. Tone check before the group.
# 50 KB at 30-20, 5 KB at 15-0, 2 runs each, 60-min time box. Measured S:N is the axis.
[campaign]
name = "fade-vara-mpm-5k"
stage = "fading"
replicates = 2
profiles = ["MPM"]
snr_db = [15, 10, 5, 0]
order = "blocked-random"
order_seed = 61
abort_minutes = 90
abort_retries = 3
time_box_minutes = 60

[ionos]
bandwidth_hz = 3000
multipaths = 2

[payload]
file = "Text_5KB"
bytes = 5120
sha256 = "85741279e9a689624407e58e599340c048a72fdd56c9695345c6a1ac827384d4"
messages = 10

[[modems]]
name = "VARA HF"
version = "4.9.1"
bandwidth_hz = 2750

[[impairments]]
name = "none"
