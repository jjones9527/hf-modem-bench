# Aether HF 0.2.0-beta.159 (pinned for the whole stage), same WGN settings, order seeds and time box as the other
# modems; one-way station 2 (VE3XZQ) -> station 1 (VA3ZTF), station 2 through the bench relay (8320 -> 8310).
# aetherd headless, started by hfbench_start_aether.ps1 (busy detection off, project upload off, profile none);
# recovery restarts both daemons. tx_level 0.35: data 3.1 dB under the reference, peaks -1.5 dBFS (D5 exception:
# the reference would clip, PAPR 10.3 dB). Measured S:N is the axis.
[campaign]
name = "sweep-aether-50k"
stage = "coarse"
replicates = 3
profiles = ["WGN"]
snr_db = [40, 22, 17]
order = "blocked-random"
order_seed = 40
abort_minutes = 90
abort_retries = 3
time_box_minutes = 60

[ionos]
bandwidth_hz = 3000
multipaths = 2

[payload]
file = "Text_50KB"
bytes = 51200
sha256 = "3ec10a0b30de0039bb0b949d7e160a5d4625c03ba2f245a60785d3973e0279f9"
messages = 10

[[modems]]
name = "Aether HF"
version = "0.2.0-beta.159"
bandwidth_hz = 2300

[[impairments]]
name = "none"
