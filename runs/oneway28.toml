# ARDOP on the cal7 bench, ONE-WAY: station 1 (VA3ZTF, Syba) sends all 10 messages to station 2 (VE3XZQ, Sabrent);
# station 2 sends none (messages build --s1-messages 10 --s2-messages 0). Measured data S:N at WGN 28 was ~18 dB
# (cal7wgn28 listen). Question: is one-way 16QAM reliable enough to be the good-conditions baseline?

[campaign]
name = "oneway28"
stage = "pilot"
replicates = 3
profiles = ["WGN"]
snr_db = [28]
order = "sequential"
abort_minutes = 90
abort_retries = 3

[ionos]
bandwidth_hz = 3000
multipaths = 2

[payload]
file = "Text_50KB"
bytes = 51200
sha256 = "3ec10a0b30de0039bb0b949d7e160a5d4625c03ba2f245a60785d3973e0279f9"
messages = 10

[[modems]]
name = "ARDOP"
version = "1.0.2.9"
bandwidth_hz = 2000

[[impairments]]
name = "none"
