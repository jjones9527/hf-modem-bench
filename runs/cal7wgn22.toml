# ARDOP on the cal7 bench (results log): WGN 22, 2 replicates. Tone at the IONOS reference (-0.2/-0.4 dB), so ARDOP
# data S:N ~ setting - 8 dB (about 14 dB). Station 1 (VA3ZTF) = Syba, station 2 (VE3XZQ) = Sabrent.
# Question: on a calibrated, unclipped bench, does the 16QAM asymmetry/corruption remain?

[campaign]
name = "cal7wgn22"
stage = "pilot"
replicates = 2
profiles = ["WGN"]
snr_db = [22]
order = "sequential"
abort_minutes = 90          # 10 x ~42 KB at ARDOP ~14 dB data S:N took ~50 min on 10 Nov
abort_retries = 3

[ionos]
bandwidth_hz = 3000
multipaths = 2

[payload]
file = "Text_50KB"
bytes = 51200
sha256 = "3ec10a0b30de0039bb0b949d7e160a5d4625c03ba2f245a60785d3973e0279f9"
messages = 10

[[modems]]
name = "ARDOP"
version = "1.0.2.9"
bandwidth_hz = 2000

[[impairments]]
name = "none"
