[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hfbench"
version = "0.1.0"
description = "Bench-test toolchain for software HF modems used with Winlink Express"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
hfbench = "hfbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
